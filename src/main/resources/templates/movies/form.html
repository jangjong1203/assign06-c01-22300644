<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h2 class="mb-4 text-center">신규 영화 등록</h2>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/movies}" method="post">


                        <div class="mb-3">
                            <label for="title" class="form-label">제목 (Title)</label>
                            <input type="text" class="form-control" id="title" name="title" required placeholder="예: 인셉션">
                        </div>

                        <div class="mb-3">
                            <label for="director" class="form-label">감독 (Director)</label>
                            <input type="text" class="form-control" id="director" name="director" required placeholder="예: 크리스토퍼 놀란">
                        </div>

                        <div class="mb-3">
                            <label for="genre" class="form-label">장르 (Genre)</label>
                            <input type="text" class="form-control" id="genre" name="genre" required placeholder="예: SF/액션">
                        </div>

                        <div class="mb-3">
                            <label for="year" class="form-label">개봉연도 (Year)</label>

                            <input type="number" class="form-control" id="year" name="year" required min="1800" max="2026" placeholder="예: 2010">
                        </div>

                        <div class="mb-4">
                            <label for="rating" class="form-label">평점 (Rating)</label>

                            <input type="number" class="form-control" id="rating" name="rating" required min="0" max="10" step="0.1" placeholder="예: 8.8">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">

                            <a th:href="@{/movies}" class="btn btn-secondary me-md-2">목록으로 취소</a>

                            <button type="submit" class="btn btn-primary">영화 등록 완료</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
